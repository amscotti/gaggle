name: Release

# Publishes platform archives to a GitHub Release when a version tag is
# pushed. The tag must match Cargo.toml (e.g. v0.1.0 for version = "0.1.0").
#
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_ver=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          if [ "$tag" != "$cargo_ver" ]; then
            echo "tag v${tag} does not match Cargo.toml version ${cargo_ver}"
            exit 1
          fi

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --all

  build:
    name: ${{ matrix.target }}
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: gaggle
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: gaggle
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: gaggle
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: gaggle
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: gaggle.exe
            archive: zip
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="gaggle-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [ "${{ runner.os }}" != "Windows" ]; then
            strip "$bin"
          fi
          cp "$bin" "$staging/"
          cp README.md LICENSE "$staging/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${staging}.zip" "$staging"
          else
            tar -czf "${staging}.tar.gz" "$staging"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gaggle-${{ matrix.target }}
          path: gaggle-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
